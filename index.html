<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="질환 유형과 환자 위치를 바탕으로 수도권 주요 병원을 비교하는 공간 복지 대시보드">
    <title>수도권 주요 병원 공간 복지 대시보드 (질환별 맞춤 평가)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f4f7f6; color: #333; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            padding: 20px;
        }

        /* 좌측 랭킹 패널 */
        .left-panel { top: 20px; left: 20px; width: 340px; bottom: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .left-panel h2 { margin: 0 0 15px 0; font-size: 19px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }

        .hospital-card { background: #fff; border: 1px solid #e0e6ed; border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: all 0.2s; }
        .hospital-card.rank-1 { border: 2px solid #e74c3c; background: #fdf2f0; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .h-name { font-weight: bold; font-size: 15px; color: #2c3e50; }
        .h-region { font-size: 11px; color: #7f8c8d; margin-left: 5px; }
        .h-rank { font-size: 12px; font-weight: bold; color: #fff; background: #95a5a6; padding: 3px 8px; border-radius: 12px; }
        .rank-1 .h-rank { background: #e74c3c; }
        .h-score { font-size: 20px; font-weight: bold; color: #2980b9; margin: 5px 0; }
        .h-stat { font-size: 12px; color: #7f8c8d; }

        /* 우측 상단 데이터 & 레이어 컨트롤 */
        .right-panel { top: 20px; right: 20px; width: 280px; }
        .right-panel h3 { margin: 0 0 10px 0; font-size: 15px; color: #34495e; border-bottom: 1px solid #ccc; padding-bottom: 5px; }

        /* 질환 유형 선택 UI */
        .disease-selector { margin-bottom: 15px; background: #e8f4f8; padding: 10px; border-radius: 8px; }
        .disease-selector label { display: block; font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; cursor: pointer; }
        .disease-selector input[type="radio"] { margin-right: 8px; accent-color: #3498db; }

        .data-upload { margin-bottom: 15px; background: #eef2f5; padding: 10px; border-radius: 8px; font-size: 13px; }
        .data-upload input { margin-top: 5px; font-size: 12px; width: 100%; }
        .checkbox-group label { display: block; margin-bottom: 8px; font-size: 14px; cursor: pointer; }

        /* 하단 슬라이더 패널 */
        .bottom-panel { bottom: 30px; left: 50%; transform: translateX(-50%); width: 600px; }
        .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }
        .slider-header span { font-weight: bold; color: #2c3e50; font-size: 16px; }
        #severityVal { color: #e74c3c; font-size: 22px; font-weight: bold; }

        .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 25px; }
        .slider-item { display: flex; flex-direction: column; }
        .slider-item label { font-size: 13px; font-weight: bold; color: #34495e; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .slider-item label span { color: #3498db; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #3498db; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel left-panel">
        <h2>🏥 질환 맞춤 최적 병원 추천</h2>
        <div id="rankingList"></div>
    </div>

    <div class="panel right-panel">
        <h3>📋 환자 질환 유형 선택</h3>
        <div class="disease-selector">
            <label><input type="radio" name="diseaseType" value="급성" checked> ⚡ 급성 질환 (심뇌혈관, 중증외상 등)</label>
            <label><input type="radio" name="diseaseType" value="만성"> 🩸 만성 질환 (당뇨, 고혈압, 신장 등)</label>
            <label><input type="radio" name="diseaseType" value="암"> 🎗️ 중증 암 질환 (수술 및 항암)</label>
        </div>

        <h3>📂 상대평가 데이터 연동</h3>
        <div class="data-upload">
            <label><b>'병원별 평가.csv'</b> 업로드</label>
            <input type="file" id="csvFileInput" accept=".csv">
            <div id="uploadStatus" style="color: #e74c3c; margin-top: 5px; font-weight: bold; font-size: 11px;">현재 기본 가상 점수 사용 중</div>
        </div>

        <h3>🗺️ 지도 레이어 설정</h3>
        <div class="checkbox-group">
            <label><input type="checkbox" id="toggleVoronoi" checked> 진료 세력권 (보로노이)</label>
            <label><input type="checkbox" id="toggleHospitals" checked> 병원 위치</label>
        </div>
    </div>

    <div class="panel bottom-panel">
        <div class="slider-header">
            <span>🚨 종합 환자 중증도</span>
            <span id="severityVal">50.0 점</span>
        </div>
        <div class="slider-grid">
            <div class="slider-item">
                <label>활력 징후 불안정성 (40%) <span id="valV">50</span></label>
                <input type="range" id="sliderV" min="0" max="100" step="1" value="50">
            </div>
            <div class="slider-item">
                <label>골든타임 질환 여부 (35%) <span id="valG">50</span></label>
                <input type="range" id="sliderG" min="0" max="100" step="1" value="50">
            </div>
            <div class="slider-item">
                <label>통증 척도 강도 (15%) <span id="valP">50</span></label>
                <input type="range" id="sliderP" min="0" max="100" step="1" value="50">
            </div>
            <div class="slider-item">
                <label>환자 취약성 (기저질환) (10%) <span id="valW">50</span></label>
                <input type="range" id="sliderW" min="0" max="100" step="1" value="50">
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 1. 기본 데이터 세팅 (질환별 초기 점수 할당)
        let hospitals = [
            { id: 1, name: '서울대학교병원', region: '서울', lat: 37.579, lon: 126.999, scores: { '급성': 98, '만성': 95, '암': 99 } },
            { id: 2, name: '연세대학교 세브란스병원', region: '서울', lat: 37.562, lon: 126.940, scores: { '급성': 96, '만성': 96, '암': 97 } },
            { id: 3, name: '삼성서울병원', region: '서울', lat: 37.488, lon: 127.085, scores: { '급성': 95, '만성': 94, '암': 98 } },
            { id: 4, name: '서울아산병원', region: '서울', lat: 37.526, lon: 127.108, scores: { '급성': 97, '만성': 96, '암': 98 } },
            { id: 5, name: '서울성모병원', region: '서울', lat: 37.501, lon: 127.004, scores: { '급성': 94, '만성': 95, '암': 95 } },
            { id: 6, name: '고려대학교 안암병원', region: '서울', lat: 37.587, lon: 127.026, scores: { '급성': 92, '만성': 90, '암': 91 } },
            { id: 7, name: '경희대학교병원', region: '서울', lat: 37.594, lon: 127.051, scores: { '급성': 89, '만성': 91, '암': 88 } },
            { id: 8, name: '한양대학교병원', region: '서울', lat: 37.559, lon: 127.045, scores: { '급성': 89, '만성': 88, '암': 89 } },
            { id: 9, name: '이대서울병원', region: '서울', lat: 37.557, lon: 126.836, scores: { '급성': 87, '만성': 89, '암': 86 } },
            { id: 10, name: '이화여자대학교 목동병원', region: '서울', lat: 37.537, lon: 126.886, scores: { '급성': 86, '만성': 87, '암': 88 } },
            { id: 11, name: '중앙대학교병원', region: '서울', lat: 37.506, lon: 126.960, scores: { '급성': 89, '만성': 88, '암': 87 } },
            { id: 12, name: '건국대학교병원', region: '서울', lat: 37.540, lon: 127.071, scores: { '급성': 88, '만성': 89, '암': 87 } },
            { id: 13, name: '강동경희대학교병원', region: '서울', lat: 37.553, lon: 127.157, scores: { '급성': 86, '만성': 88, '암': 85 } },
            { id: 14, name: '분당서울대학교병원', region: '경기 성남', lat: 37.352, lon: 127.123, scores: { '급성': 95, '만성': 94, '암': 96 } },
            { id: 15, name: '아주대학교병원', region: '경기 수원', lat: 37.279, lon: 127.047, scores: { '급성': 94, '만성': 90, '암': 91 } },
            { id: 16, name: '차의과학대학교 분당차병원', region: '경기 성남', lat: 37.410, lon: 127.125, scores: { '급성': 86, '만성': 87, '암': 86 } },
            { id: 17, name: '한림대학교성심병원', region: '경기 안양', lat: 37.391, lon: 126.961, scores: { '급성': 88, '만성': 86, '암': 85 } },
            { id: 18, name: '순천향대학교 부천병원', region: '경기 부천', lat: 37.502, lon: 126.761, scores: { '급성': 87, '만성': 87, '암': 86 } },
            { id: 19, name: '명지병원', region: '경기 고양', lat: 37.643, lon: 126.833, scores: { '급성': 85, '만성': 86, '암': 84 } },
            { id: 20, name: '동국대학교일산병원', region: '경기 고양', lat: 37.676, lon: 126.806, scores: { '급성': 86, '만성': 86, '암': 85 } },
            { id: 21, name: '국민건강보험 일산병원', region: '경기 고양', lat: 37.644, lon: 126.793, scores: { '급성': 87, '만성': 88, '암': 87 } },
            { id: 22, name: '가톨릭대학교 성빈센트병원', region: '경기 수원', lat: 37.277, lon: 127.027, scores: { '급성': 86, '만성': 85, '암': 85 } },
            { id: 23, name: '용인세브란스병원', region: '경기 용인', lat: 37.276, lon: 127.153, scores: { '급성': 88, '만성': 87, '암': 88 } },
            { id: 24, name: '인하대학교병원', region: '인천', lat: 37.447, lon: 126.632, scores: { '급성': 89, '만성': 87, '암': 88 } },
            { id: 25, name: '가천대 길병원', region: '인천', lat: 37.452, lon: 126.709, scores: { '급성': 91, '만성': 88, '암': 89 } },
            { id: 26, name: '가톨릭대학교 인천성모병원', region: '인천', lat: 37.485, lon: 126.724, scores: { '급성': 87, '만성': 87, '암': 86 } }
        ];

        const colors = ['#a1c9f4', '#ffb482', '#8de5a1', '#ff9f9b', '#d0bbff', '#debb9b', '#fab0e4', '#cfcfcf', '#fffea3', '#b9f2f0', '#c2e0c6', '#eac6ff'];

        const map = L.map('map', { zoomControl: false }).setView([37.50, 126.98], 10);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const voronoiLayer = L.layerGroup().addTo(map);
        const hospitalLayer = L.layerGroup().addTo(map);
        let patientMarker = null;
        let bestRouteLine = null;

        let patientPos = { lat: 37.53, lon: 126.98 };

        // 현재 선택된 질환 유형 가져오기 함수
        function getSelectedDiseaseType() {
            return document.querySelector('input[name="diseaseType"]:checked').value;
        }

        function normalizeHospitalName(value) {
            return String(value || '').replace(/\s/g, '');
        }

        function parseScore(...values) {
            const raw = values.find(value => value !== undefined && value !== null && value !== '');
            const score = Number.parseFloat(raw);
            return Number.isFinite(score) ? score : null;
        }

        // CSV 파일 업로드 및 데이터 병합 로직 (급성/만성/암 매핑)
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    const data = results.data;
                    let matchedCount = 0;

                    hospitals.forEach(h => {
                        // 엑셀의 '병원명' 또는 '병원' 열을 기준으로 매칭
                        const row = data.find(r => {
                            const importedName = normalizeHospitalName(r['병원명'] || r['병원']);
                            return importedName && normalizeHospitalName(h.name).includes(importedName);
                        });

                        if (row) {
                            // 엑셀 열 이름이 급성, 만성, 암 혹은 관련 이름이라고 가정하고 추출
                            const acuteScore = parseScore(row['급성'], row['급성점수']);
                            const chronicScore = parseScore(row['만성'], row['만성점수']);
                            const cancerScore = parseScore(row['암'], row['암점수']);

                            if (acuteScore !== null) h.scores['급성'] = acuteScore;
                            if (chronicScore !== null) h.scores['만성'] = chronicScore;
                            if (cancerScore !== null) h.scores['암'] = cancerScore;

                            matchedCount++;
                        }
                    });

                    document.getElementById('uploadStatus').innerText = `✅ 데이터 연동 완료 (${matchedCount}개 병원 갱신)`;
                    document.getElementById('uploadStatus').style.color = '#27ae60';
                    analyzeHospitals(); // 데이터 갱신 후 즉시 재분석
                }
            });
        });

        function drawVoronoi() {
            voronoiLayer.clearLayers();
            const points = turf.featureCollection(hospitals.map(h => turf.point([h.lon, h.lat])));
            const bbox = [126.3, 37.0, 127.5, 38.0];
            const voronoiPolygons = turf.voronoi(points, {bbox: bbox});

            L.geoJSON(voronoiPolygons, {
                style: function () {
                    return {
                        color: '#95a5a6', weight: 1,
                        fillColor: colors[Math.floor(Math.random() * colors.length)],
                        fillOpacity: 0.25
                    };
                }
            }).addTo(voronoiLayer);
        }

        function analyzeHospitals() {
            const valV = parseInt(document.getElementById('sliderV').value);
            const valG = parseInt(document.getElementById('sliderG').value);
            const valP = parseInt(document.getElementById('sliderP').value);
            const valW = parseInt(document.getElementById('sliderW').value);

            document.getElementById('valV').innerText = valV;
            document.getElementById('valG').innerText = valG;
            document.getElementById('valP').innerText = valP;
            document.getElementById('valW').innerText = valW;

            const severity = (valV * 0.40) + (valG * 0.35) + (valP * 0.15) + (valW * 0.10);
            document.getElementById('severityVal').innerText = severity.toFixed(1) + " 점";

            const diseaseType = getSelectedDiseaseType();
            const pPoint = turf.point([patientPos.lon, patientPos.lat]);
            let results = [];

            hospitals.forEach(h => {
                const hPoint = turf.point([h.lon, h.lat]);
                const dist = turf.distance(pPoint, hPoint, {units: 'kilometers'});
                const penalty = dist * ((100 - severity) / 50.0);

                // 선택된 질환(급성/만성/암)에 해당하는 병원의 상대평가 점수를 Base Score로 사용
                const currentBaseScore = h.scores[diseaseType];
                let dynamicScore = currentBaseScore - penalty;

                results.push({ ...h, distance: dist, score: dynamicScore, appliedBaseScore: currentBaseScore });
            });

            results.sort((a, b) => b.score - a.score);
            updateUI(results, diseaseType);
        }

        function updateUI(results, diseaseType) {
            const listContainer = document.getElementById('rankingList');
            listContainer.innerHTML = '';

            results.slice(0, 5).forEach((h, index) => {
                const rank = index + 1;
                const card = document.createElement('div');
                card.className = `hospital-card ${rank === 1 ? 'rank-1' : ''}`;

                card.innerHTML = `
                    <div class="h-header">
                        <div><span class="h-name">${h.name}</span><span class="h-region">[${h.region}]</span></div>
                        <span class="h-rank">${rank}위</span>
                    </div>
                    <div class="h-score">${h.score.toFixed(1)} 점</div>
                    <div class="h-stat">[${diseaseType}] 평가 ${h.appliedBaseScore.toFixed(1)}점 | 환자까지 직선거리 ${h.distance.toFixed(1)}km</div>
                `;
                listContainer.appendChild(card);
            });

            hospitalLayer.clearLayers();
            hospitals.forEach(h => {
                const isBest = h.id === results[0].id;
                const markerHtml = `<div style="background-color: ${isBest ? '#e74c3c' : '#3498db'}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`;
                const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [18, 18], iconAnchor: [9, 9] });

                L.marker([h.lat, h.lon], { icon: icon })
                 .bindTooltip(h.name, { permanent: isBest, direction: 'right', className: 'h-tooltip' })
                 .addTo(hospitalLayer);
            });

            if (patientMarker) map.removeLayer(patientMarker);
            const pIcon = L.divIcon({ html: `<div style="font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">⭐</div>`, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
            patientMarker = L.marker([patientPos.lat, patientPos.lon], { icon: pIcon, zIndexOffset: 1000 }).addTo(map);

            if (bestRouteLine) map.removeLayer(bestRouteLine);
            bestRouteLine = L.polyline([[patientPos.lat, patientPos.lon], [results[0].lat, results[0].lon]], {
                color: '#e74c3c', weight: 4, dashArray: '8, 8', opacity: 0.8
            }).addTo(map);
        }

        map.on('click', function(e) {
            patientPos.lat = e.latlng.lat;
            patientPos.lon = e.latlng.lng;
            analyzeHospitals();
        });

        // 슬라이더 및 질환 유형 라디오 버튼 이벤트 리스너
        ['sliderV', 'sliderG', 'sliderP', 'sliderW'].forEach(id => {
            document.getElementById(id).addEventListener('input', analyzeHospitals);
        });

        document.querySelectorAll('input[name="diseaseType"]').forEach(radio => {
            radio.addEventListener('change', analyzeHospitals);
        });

        document.getElementById('toggleVoronoi').addEventListener('change', function(e) {
            e.target.checked ? map.addLayer(voronoiLayer) : map.removeLayer(voronoiLayer);
        });
        document.getElementById('toggleHospitals').addEventListener('change', function(e) {
            e.target.checked ? map.addLayer(hospitalLayer) : map.removeLayer(hospitalLayer);
        });

        const style = document.createElement('style');
        style.innerHTML = `.h-tooltip { background: rgba(255,255,255,0.85); border: none; font-weight: bold; color: #2c3e50; padding: 2px 6px; }`;
        document.head.appendChild(style);

        drawVoronoi();
        analyzeHospitals();
    </script>
</body>
</html>
